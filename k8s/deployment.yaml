apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-app
        image: 656732270450.dkr.ecr.ap-southeast-1.amazonaws.com/redis-session-demo:v1
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_URL
          value: "redis://redis-master.demo.svc.cluster.local:6379"
        - name: MONGO_URL
          value: "mongodb://mongodb.demo.svc.cluster.local:27017/beerapp" 
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: nodejs-secret
              key: SESSION_SECRET
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10